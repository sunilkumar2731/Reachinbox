services:
  # ── Backend Web API Service ────────────────────────────────────────────────
  - type: web
    name: reachinbox-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd reachinbox-email-scheduler && npm install && npm run build:backend && npx prisma db push
    startCommand: cd reachinbox-email-scheduler && npm run start --workspace=apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: reachinbox-redis
          property: password
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true

  # ── BullMQ Background Worker Service ──────────────────────────────────────
  - type: worker
    name: reachinbox-worker
    env: node
    region: oregon
    plan: free
    buildCommand: cd reachinbox-email-scheduler && npm install && npm run build:backend
    startCommand: cd reachinbox-email-scheduler && npm run start:worker --workspace=apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: reachinbox-redis
          property: password
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox_user
    region: oregon
    plan: free
